name: Submit App Store Review

on:
  workflow_dispatch:
    inputs:
      version:
        description: "마케팅 버전 (예: 1.1.0)"
        required: true
        type: string
      confirm:
        description: "릴리즈 노트 반영과 macOS 심사 요청을 실행합니다"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: app-store-review-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  submit-review:
    if: ${{ inputs.confirm }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - id: release
        name: Validate release version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="$INPUT_VERSION"
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]; then
            echo "Version must use numeric marketing-version format, such as 1.1.0." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Write App Store Connect API key
        env:
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          umask 077
          printf '%s' "$APP_STORE_CONNECT_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
      - id: build
        name: Confirm macOS build
        env:
          APP_STORE_CONNECT_API_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
        run: |
          bundle exec ruby scripts/wait_for_app_store_build.rb \
            --version "${{ steps.release.outputs.version }}" \
            --platform MAC_OS --timeout-seconds 0
      - name: Upload release notes and submit macOS review
        env:
          APP_STORE_CONNECT_API_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
        run: |
          bundle exec fastlane mac submit_review \
            version:"${{ steps.build.outputs.version }}" \
            build_number:"${{ steps.build.outputs.build_number }}" confirm:true
      - name: Remove App Store Connect API key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
