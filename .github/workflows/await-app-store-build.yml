name: Await App Store Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "마케팅 버전 (예: 1.1.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: app-store-build-${{ github.event_name == 'push' && github.ref_name || inputs.version }}
  cancel-in-progress: false

jobs:
  await-build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - id: release
        name: Resolve release version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]; then
            echo "Version must use numeric marketing-version format, such as 1.1.0." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Write App Store Connect API key
        env:
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          umask 077
          printf '%s' "$APP_STORE_CONNECT_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
      - id: build
        name: Wait for macOS build
        env:
          APP_STORE_CONNECT_API_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
        run: |
          bundle exec ruby scripts/wait_for_app_store_build.rb \
            --version "${{ steps.release.outputs.version }}" \
            --platform MAC_OS --timeout-seconds 4200
      - name: Distribute to TestFlight internal testers
        env:
          APP_STORE_CONNECT_API_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
        run: |
          bundle exec ruby scripts/distribute_testflight.rb \
            --version "${{ steps.build.outputs.version }}" \
            --build-number "${{ steps.build.outputs.build_number }}"
      - name: Remove App Store Connect API key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
